name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Static analysis
        run: uv run ruff check localflow tests

      - name: Non-interactive tests
        run: |
          set -e
          for test_file in \
            tests/test_settings.py \
            tests/test_context.py \
            tests/test_habits.py \
            tests/test_fn_listener.py \
            tests/test_process.py \
            tests/test_logging.py \
            tests/test_security.py \
            tests/test_packaging.py \
            tests/test_stt.py
          do
            uv run python "$test_file"
          done
          zsh -n scripts/install-launchagent.sh

      - name: Dependency audit
        run: |
          uv export --frozen --all-extras --no-dev --no-hashes --no-emit-project \
            --output-file "${RUNNER_TEMP}/requirements.txt"
          uv run pip-audit -r "${RUNNER_TEMP}/requirements.txt"
